services:
  make-noise-bot:
    image: meltyshev/make-noise-bot:latest
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data

# First run (creates ./data/config.json interactively):
#   docker compose run --rm make-noise-bot
# or non-interactively:
#   docker compose run --rm make-noise-bot --token 123456:ABC-DEF
# then:
#   docker compose up -d
